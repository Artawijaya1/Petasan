[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zero-touch-agent"
version = "0.1.0"
description = "Zero-Touch Environment Provisioner - Local Agent CLI"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "websockets>=12.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
]

[project.scripts]
zero-touch-agent = "main:cli_entry"

[tool.hatch.build.targets.wheel]
include = [
    "main.py",
    "runner.py",
    "agents/**",
    "rag/**",
]
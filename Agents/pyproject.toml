[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zeto"
version = "0.1.0"
description = "Zero-Touch Environment Provisioner - Local Agent CLI"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
zeto = "cli_runner:main_sync"

[tool.hatch.build.targets.wheel]
include = [
    "cli_runner.py",
]